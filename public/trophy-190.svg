<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1c5"/>
      <stop offset="35%" stop-color="#f5a623"/>
      <stop offset="70%" stop-color="#ffbe38"/>
      <stop offset="100%" stop-color="#c97a00"/>
    </linearGradient>
    <radialGradient id="trophyGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ffbe38" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffbe38" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Aura Glow -->
  <circle cx="250" cy="220" r="190" fill="url(#trophyGlow)"/>

  <!-- Laurel Wreath Left -->
  <g stroke="url(#goldGrad)" stroke-width="4" fill="none" opacity="0.85">
    <path d="M 120 340 C 90 280, 90 180, 150 110" />
    <path d="M 110 320 Q 95 310, 110 295 Q 125 305, 110 320" fill="url(#goldGrad)" />
    <path d="M 95 265 Q 80 255, 95 240 Q 110 250, 95 265" fill="url(#goldGrad)" />
    <path d="M 95 210 Q 80 200, 95 185 Q 110 195, 95 210" fill="url(#goldGrad)" />
    <path d="M 115 155 Q 105 140, 125 130 Q 135 145, 115 155" fill="url(#goldGrad)" />
  </g>

  <!-- Laurel Wreath Right -->
  <g stroke="url(#goldGrad)" stroke-width="4" fill="none" opacity="0.85">
    <path d="M 380 340 C 410 280, 410 180, 350 110" />
    <path d="M 390 320 Q 405 310, 390 295 Q 375 305, 390 320" fill="url(#goldGrad)" />
    <path d="M 405 265 Q 420 255, 405 240 Q 390 250, 405 265" fill="url(#goldGrad)" />
    <path d="M 405 210 Q 420 200, 405 185 Q 390 195, 405 210" fill="url(#goldGrad)" />
    <path d="M 385 155 Q 395 140, 375 130 Q 365 145, 385 155" fill="url(#goldGrad)" />
  </g>

  <!-- Trophy Cup Body -->
  <g filter="url(#shadow)">
    <!-- Handles -->
    <path d="M 160 160 C 90 160, 90 260, 175 270" stroke="url(#goldGrad)" stroke-width="14" fill="none" stroke-linecap="round"/>
    <path d="M 340 160 C 410 160, 410 260, 325 270" stroke="url(#goldGrad)" stroke-width="14" fill="none" stroke-linecap="round"/>

    <!-- Cup -->
    <path d="M 160 120 L 340 120 L 325 240 C 320 300, 180 300, 175 240 Z" fill="url(#goldGrad)"/>
    <ellipse cx="250" cy="120" rx="90" ry="20" fill="#fff5d9"/>

    <!-- Cup Details -->
    <path d="M 250 290 L 250 350" stroke="url(#goldGrad)" stroke-width="26" stroke-linecap="round"/>
    <ellipse cx="250" cy="350" rx="45" ry="12" fill="url(#goldGrad)"/>

    <!-- Pedestal Base -->
    <polygon points="170,370 330,370 345,420 155,420" fill="#2d0a14" stroke="url(#goldGrad)" stroke-width="4"/>
    <rect x="150" y="420" width="200" height="24" rx="6" fill="url(#goldGrad)"/>

    <!-- Score Badge on Trophy -->
    <circle cx="250" cy="205" r="48" fill="#1b050c" stroke="#fff1c5" stroke-width="3"/>
    <text x="250" y="215" font-family="'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="url(#goldGrad)" text-anchor="middle">190+</text>
    <text x="250" y="235" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#fff" text-anchor="middle" letter-spacing="1">TARGET</text>

    <!-- Base Plaque -->
    <rect x="180" y="380" width="140" height="28" rx="4" fill="url(#goldGrad)"/>
    <text x="250" y="399" font-family="'Noto Sans Sinhala', sans-serif" font-size="12" font-weight="bold" fill="#240c00" text-anchor="middle">පහ දිනන හපන්නු</text>
  </g>

  <!-- Stars on top -->
  <polygon points="250,55 256,72 274,72 259,83 265,100 250,89 235,100 241,83 226,72 244,72" fill="url(#goldGrad)"/>
  <polygon points="200,75 204,87 217,87 206,95 210,107 200,99 190,107 194,95 183,87 196,87" fill="url(#goldGrad)" opacity="0.85"/>
  <polygon points="300,75 304,87 317,87 306,95 310,107 300,99 290,107 294,95 283,87 296,87" fill="url(#goldGrad)" opacity="0.85"/>
</svg>

